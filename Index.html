<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Translator</title>
    <meta name="description" content="A responsive retro-style language translator for instant translations.">
    <meta name="keywords" content="language translator, web app, responsive design, retro style, translation">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.3/dist/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
        .retro-container {
            background: #f5f5f5;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 2px 2px 20px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

    <div class="retro-container mx-auto">
        <h1 class="text-2xl xl:text-3xl font-bold mb-4 text-center">Retro Language Translator</h1>
        <form id="translate-form" class="space-y-4">
            <div>
                <label for="source-lang" class="block text-sm font-medium">Source Language</label>
                <input type="text" id="source-lang" name="source-lang" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label for="target-lang" class="block text-sm font-medium">Target Language</label>
                <input type="text" id="target-lang" name="target-lang" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required>
            </div>
            <div>
                <label for="text-to-translate" class="block text-sm font-medium">Text to Translate</label>
                <textarea id="text-to-translate" name="text-to-translate" rows="3" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500" required></textarea>
            </div>
            <div class="text-center">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded inline-flex items-center">
                    Let's Get Translating! 🚀
                
            </div>
        </form>
        <div id="output" class="mt-6 p-4 bg-white rounded shadow-sm text-sm"></div>
        <div class="text-center mt-4">
            <!-- Google AdSense Ad Unit can be placed here -->
            <ins class="adsbygoogle"
                style="display:block"
                data-ad-client="ca-app-pub-6079978336071567/3899448029"
                data-ad-slot="XXXXXX"></ins>
            <script>
              (adsbygoogle = window.adsbygoogle || []).push({});
            </script>
        </div>
    </div>

    <footer class="text-center mt-8">
        <a href="#" class="text-blue-500 hover:underline">Made with Arshu</a>
    </footer>

    <script>
        document.getElementById('translate-form').addEventListener('submit', function(event) {
            event.preventDefault();

            const sourceLang = document.getElementById('source-lang').value;
            const targetLang = document.getElementById('target-lang').value;
            const textToTranslate = document.getElementById('text-to-translate').value;

            const substitutedPrompt = `Translate the text "${textToTranslate}" from ${sourceLang} to ${targetLang}.`;

            const websocket = new WebSocket('wss://backend.buildpicoapps.com/ask_ai_streaming_v2');

            const output = document.getElementById('output');
            output.innerText = ''; // Clear previous output

            websocket.addEventListener("open", () => {
                websocket.send(JSON.stringify({
                    appId: "north-example",
                    prompt: substitutedPrompt,
                }));
            });

            websocket.addEventListener("message", (event) => {
                console.log(event.data);
                output.innerText = `${output.innerText}${event.data}`;
            });

            websocket.addEventListener("close", (event) => {
                console.log("Connection closed", event.code, event.reason);
                if (event.code != 1000) {
                    alert("Oops, we ran into an error. Refresh the page and try again.");
                }
            });

            websocket.addEventListener("error", (error) => {
                console.log('WebSocket error', error);
                alert("Oops, we ran into an error. Refresh the page and try again.");
            });
        });

        document.getElementById('add-lang').addEventListener('click', function() {
            alert('Add Language functionality to be implemented.');
        });

        document.getElementById('reset-form').addEventListener('click', function() {
            document.getElementById('translate-form').reset();
            document.getElementById('output').innerText = '';
        });
    </script>
</body>
</html>
